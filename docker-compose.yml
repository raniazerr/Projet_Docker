version: '3.8'

services:
  api:
    build: .
    container_name: todo-api
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production      
    env_file:
      - .env                    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s